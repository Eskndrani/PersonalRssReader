<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal RSS Reader — Welcome</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .hero{text-align:center;max-width:520px;padding:2rem}
    .hero-icon{font-size:3rem;margin-bottom:1rem}
    h1{font-size:2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.75rem;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero p{font-size:1.05rem;color:#94a3b8;line-height:1.6;margin-bottom:2rem}
    .cta-group{display:flex;flex-direction:column;gap:0.75rem;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.5rem;border-radius:9999px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s ease;width:100%;max-width:320px;text-decoration:none}
    .btn-email{background:#818cf8;color:#fff;border:2px solid #818cf8}
    .btn-email:hover{background:#6366f1;border-color:#6366f1}
    .btn-google{background:#1e293b;color:#f1f5f9;border:2px solid rgba(255,255,255,0.12)}
    .btn-google:hover{background:#253349;border-color:#818cf8}
    .divider{display:flex;align-items:center;gap:1rem;width:100%;max-width:320px;margin:0.25rem 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.08)}
    .divider span{font-size:0.72rem;color:#64748b}
    .login-link{margin-top:1.5rem;font-size:0.82rem;color:#64748b}
    .login-link a{color:#818cf8;font-weight:500;cursor:pointer;text-decoration:none}
    .login-link a:hover{text-decoration:underline}
    .features{margin-top:2rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
    .feature{text-align:center;color:#64748b;font-size:0.78rem}
    .feature-icon{font-size:1.3rem;display:block;margin-bottom:0.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#34d399;color:#111;padding:0.75rem 1.25rem;border-radius:8px;font-size:0.78rem;font-weight:500;z-index:1000;animation:toast-in 0.3s ease forwards;display:none}
    @keyframes toast-in{from{opacity:0;transform:translateY(0.75rem)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-icon">📰</div>
    <h1>Personal RSS Reader</h1>
    <p>Your News, Your Rules.<br>A distraction-free, AI-powered reading experience.</p>

    <div class="cta-group">
      <a href="/signup.html" class="btn btn-email">Sign Up with Email</a>
      <div class="divider"><span>or</span></div>
      <a href="/api/auth/google-login" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </a>
    </div>

    <div class="login-link">Already have an account? <a href="/login.html">Log in here</a></div>

    <div class="features">
      <div class="feature"><span class="feature-icon">🤖</span>AI Summaries</div>
      <div class="feature"><span class="feature-icon">📡</span>RSS & Podcasts</div>
      <div class="feature"><span class="feature-icon">🌐</span>Arabic + English</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      setTimeout(function () { t.style.display = "none"; }, 4000);
    }
  </script>
</body>
</html>
