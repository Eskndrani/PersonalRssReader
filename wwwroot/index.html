<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal RSS Reader</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Subscriptions</h2>
      </div>

      <form id="add-feed-form" class="add-feed-form">
        <input type="url" id="feed-url" placeholder="Paste RSS / Atom feed URL…" required autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <ul id="feed-list" class="feed-list">
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text"></span>
        </li>
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text skeleton-text--short"></span>
        </li>
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text skeleton-text--medium"></span>
        </li>
      </ul>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1>River of News</h1>
        <button id="refresh-btn" class="btn btn-secondary" title="Refresh articles">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Refresh
        </button>
      </div>

      <div class="search-bar" style="margin-left: 2cm; width: 80%;">
        <input type="text" id="search-input" placeholder="Search articles…" autocomplete="off" style="width: 100%; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: border-color 0.2s, box-shadow 0.2s;">
      </div>

      <div id="articles-container" class="articles-container">
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p>No articles yet.</p>
        <p>Add subscriptions in the sidebar, then hit <strong>Refresh</strong>.</p>
      </div>

      <div id="pagination-controls" class="pagination-controls" style="display: none;">
        <button id="prev-page-btn" class="btn btn-secondary">Previous</button>
        <span id="page-indicator">Page 1</span>
        <button id="next-page-btn" class="btn btn-secondary">Next</button>
        <span class="jump-to-page">
          <label for="jump-page-input">Jump to</label>
          <input type="number" id="jump-page-input" min="1" placeholder="#" autocomplete="off">
        </span>
      </div>
    </main>

  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="read-modal" class="modal" style="display: none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" title="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/site.js"></script>
</body>
</html>
