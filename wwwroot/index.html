<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal RSS Reader</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 data-i18n="subscriptions">Subscriptions</h2>
        <div class="header-actions">
          <button id="lang-toggle" class="lang-toggle" title="Switch language" aria-label="Switch language">العربية</button>
          <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button id="btn-logout" class="header-logout" style="display: none;" data-i18n="logout">Logout</button>
        </div>
      </div>

      <div class="sidebar-settings">
        <label data-i18n="retentionLimit">Keep articles for:</label>
        <select id="retention-select">
          <option value="7" data-i18n="opt1Week">1 Week</option>
          <option value="14" data-i18n="opt2Weeks">2 Weeks</option>
          <option value="30" selected data-i18n="opt1Month">1 Month</option>
          <option value="60" data-i18n="opt2Months">2 Months</option>
          <option value="9999" data-i18n="optForever">Forever</option>
        </select>
      </div>

      <form id="add-feed-form" class="add-feed-form">
        <textarea id="feed-url" rows="3" placeholder="Paste one or more URLs (one per line)" required autocomplete="off"></textarea>
        <div class="add-feed-credentials">
          <input type="text" id="feed-username" placeholder="Username (optional)" autocomplete="off">
          <input type="password" id="feed-password" placeholder="Password (optional)" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary add-feed-btn" data-i18n="add">Add</button>
      </form>

      <input type="text" id="feed-search-sidebar" class="feed-search-sidebar" placeholder="Search subscriptions…" autocomplete="off">

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="all" data-i18n="allFeeds">All</button>
        <button class="tab-btn" data-tab="fav" data-i18n="favorites">Favorites</button>
      </div>

      <div class="feed-list-controls">
        <button id="btn-show-all" class="text-btn" data-i18n="showAll">Show All</button>
        <button id="btn-hide-all" class="text-btn" data-i18n="hideAll">Hide All</button>
      </div>

      <ul id="feed-list" class="feed-list">
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text"></span>
        </li>
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text skeleton-text--short"></span>
        </li>
        <li class="feed-item skeleton-feed">
          <span class="skeleton-block skeleton-text skeleton-text--medium"></span>
        </li>
      </ul>
    </aside>

    <main class="main">
      <div class="main-header">
        <h1 data-i18n="riverOfNews">River of News</h1>
        <button id="refresh-btn" class="btn btn-secondary" title="Refresh articles">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span data-i18n="refresh">Refresh</span>
        </button>
      </div>

      <div class="main-tabs">
        <button class="tab-btn active" data-article-tab="all" data-i18n="allArticles">All News</button>
        <button class="tab-btn" data-article-tab="bookmarks" data-i18n="bookmarkedArticles">Bookmarks</button>
      </div>

      <div class="search-bar">
        <input type="text" id="search-input" data-i18n-placeholder="searchArticles" placeholder="Search articles…" autocomplete="off">
        <button id="btn-daily-briefing" class="btn btn-primary" style="margin-left: 0.5rem; flex-shrink: 0;" data-i18n="dailyBriefing">Daily Briefing</button>
      </div>

      <div id="briefing-card" class="briefing-card" style="display: none;">
        <div class="briefing-content" id="briefing-content"></div>
        <button id="btn-dismiss-briefing" class="btn btn-secondary" style="margin-top: 0.5rem;" data-i18n="dismiss">Dismiss</button>
      </div>

      <div id="articles-container" class="articles-container">
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
        <article class="article-card skeleton-article">
          <div class="article-feed-source"><span class="skeleton-block skeleton-tag"></span></div>
          <h3 class="article-title"><span class="skeleton-block skeleton-text"></span></h3>
          <div class="article-meta"><span class="skeleton-block skeleton-text skeleton-text--short"></span></div>
          <p class="article-summary"><span class="skeleton-block skeleton-text"></span><span class="skeleton-block skeleton-text skeleton-text--medium"></span></p>
        </article>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p data-i18n="noArticles">No articles yet.</p>
        <p data-i18n="emptyHint">Add subscriptions in the sidebar, then hit <strong>Refresh</strong>.</p>
      </div>

      <div id="pagination-controls" class="pagination-controls" style="display: none;">
        <button id="prev-page-btn" class="btn btn-secondary" data-i18n="previous">Previous</button>
        <span id="page-indicator">Page 1</span>
        <button id="next-page-btn" class="btn btn-secondary" data-i18n="next">Next</button>
        <span class="jump-to-page">
          <label for="jump-page-input" data-i18n="jumpTo">Jump to</label>
          <input type="number" id="jump-page-input" min="1" placeholder="#" autocomplete="off">
        </span>
      </div>
    </main>

  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="auth-modal" class="modal" style="display: flex;">
    <div class="modal-backdrop"></div>
    <div class="modal-content auth-modal-content">
      <div id="auth-login-form" class="auth-form">
        <h2 data-i18n="loginTitle">Log In</h2>
        <input type="email" id="login-email" placeholder="Email" autocomplete="email">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button type="submit" class="btn btn-primary login-btn">Log In</button>
        <p class="auth-switch"><span data-i18n="noAccount">No account?</span> <a href="#" id="show-register" data-i18n="signUpHere">Sign up here</a></p>
      </div>
      <div id="auth-register-form" class="auth-form" style="display: none;">
        <h2 data-i18n="registerTitle">Create Account</h2>
        <input type="email" id="register-email" placeholder="Email" autocomplete="email">
        <input type="password" id="register-password" placeholder="Password" autocomplete="new-password">
        <button type="submit" class="btn btn-primary register-btn">Sign Up</button>
        <p class="auth-switch"><span data-i18n="haveAccount">Already have an account?</span> <a href="#" id="show-login" data-i18n="logInHere">Log in here</a></p>
      </div>
      <p id="auth-error" class="auth-error" style="display: none;"></p>
    </div>
  </div>

  <div id="read-modal" class="modal" style="display: none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" data-i18n-title="close" title="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="chat-widget" class="chat-widget" style="display: none;">
    <button id="btn-chat-toggle" class="chat-toggle-btn" title="Chat with your feeds">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <div class="chat-panel" style="display: none;">
      <div class="chat-header">
        <span data-i18n="chatTitle">Chat with your feeds</span>
        <button class="chat-close-btn">&times;</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask about your news..." data-i18n-placeholder="chatPlaceholder">
        <button id="btn-chat-send" class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>

  <script src="/site.js"></script>
</body>
</html>
